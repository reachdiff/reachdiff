[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reachdiff"
version = "0.9.0"
description = "Effective Unity Catalog access diff for Terraform plans"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/reachdiff/reachdiff"
Issues = "https://github.com/reachdiff/reachdiff/issues"
Changelog = "https://github.com/reachdiff/reachdiff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
databricks = ["databricks-sdk==0.140.0"]

[project.scripts]
reachdiff = "reachdiff.cli:main"

[tool.setuptools.packages.find]
include = ["reachdiff*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"] # leave code blocks in docs and plans as written

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"] # the long-standing defaults plus import order; no rules that change behavior

[tool.ruff.format]
quote-style = "single"
